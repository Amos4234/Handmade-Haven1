<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Handmade Haven</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="background-overlay"></div>

  <header>
    <div class="container">
      <h1 class="logo">
        <img src="images/logo.png" alt="Logo" class="logo-img" />
        Handmade Haven
      </h1>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="gallery.html"><i class="fas fa-image"></i> Gallery</a></li>
          <li><a href="store.html"><i class="fas fa-store"></i> Store</a></li>
          <li><a href="artists.html"><i class="fas fa-users"></i> Artists</a></li>
          <li><a href="login.html" class="active"><i class="fas fa-user"></i> Login</a></li>
          <li><a href="cart.html" class="cart-icon"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
        </ul>
        <div class="burger">
          <div class="line1"></div>
          <div class="line2"></div>
          <div class="line3"></div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-container">
      <form class="auth-form" id="loginForm">
        <h2>Login to Handmade Haven</h2>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn login-btn">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        <p class="error-message" id="loginError"></p>
        <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Handmade Haven. All rights reserved.</p>
      <div class="social-links">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-pinterest"></i></a>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
