<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - Handmade Haven</title>
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">
        <img src="images/logo.png" alt="Logo" class="logo-img" />
        Handmade Haven
      </h1>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="gallery.html"><i class="fas fa-image"></i> Gallery</a></li>
          <li><a href="store.html"><i class="fas fa-store"></i> Store</a></li>
          <li><a href="artists.html"><i class="fas fa-users"></i> Artists</a></li>
          <li><a href="login.html"><i class="fas fa-user"></i> Login</a></li>
          <li><a href="cart.html" class="active cart-icon"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
        </ul>
        <div class="burger">
          <div class="line1"></div>
          <div class="line2"></div>
          <div class="line3"></div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="cart-container container">
      <h1><i class="fas fa-shopping-cart" style="color: var(--primary-color);"></i> Your Cart</h1>

      <div id="cart-items" class="cart-items">
        <!-- JS will inject items with images and controls -->
      </div>

      <div class="cart-totals">
        <div class="totals-details">
          <div><span>Subtotal:</span><span id="subtotal">Ksh 0</span></div>
          <div><span>Total:</span><span id="total">Ksh 0</span></div>
          <button id="checkoutBtn" class="btn checkout-btn"><i class="fas fa-credit-card"></i> Proceed to Checkout</button>
          <button id="clearCartBtn" class="btn clear-btn"><i class="fas fa-trash-alt"></i> Clear Cart</button>
          <button id="mpesaPayBtn" class="btn mpesa-btn"><i class="fas fa-mobile-alt"></i> Pay with M-Pesa</button>
        </div>
      </div>
    </section>
  </main>

  <!-- M-Pesa Modal -->
  <div id="mpesaModal" class="mpesa-modal">
    <div class="modal-content">
      <h3>Enter M-Pesa Phone Number</h3>
      <input type="tel" id="mpesaPhone" placeholder="e.g. 07XXXXXXXX" />
      <button id="confirmMpesa" class="btn">Pay Now</button>
      <p id="mpesaStatus" class="status-text"></p>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="mpesa-modal">
    <div class="modal-content">
      <img src="images/logo.png" alt="Logo" class="logo-img" style="margin-bottom: 15px;" />
      <h3>Checkout Details</h3>
      <input type="text" id="checkoutName" placeholder="Full Name" required />
      <input type="email" id="checkoutEmail" placeholder="Email Address" required />
      <input type="text" id="checkoutAddress" placeholder="Delivery Address" required />
      <button id="confirmCheckout" class="btn checkout-btn">Confirm Order</button>
      <p id="checkoutStatus" class="status-text"></p>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2025 Handmade Haven. All rights reserved.</p>
      <div class="social-links">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-pinterest"></i></a>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
