<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Handmade Haven - Store</title>
    <link rel="stylesheet" href="css/store.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">
                <img src="images/logo.png" alt="Logo" class="logo-img" />
                Handmade Haven
            </h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="gallery.html"><i class="fas fa-image"></i> Gallery</a></li>
                    <li><a href="store.html" class="active"><i class="fas fa-store"></i> Store</a></li>
                    <li><a href="artists.html"><i class="fas fa-users"></i> Artists</a></li>
                    <li><a href="login.html"><i class="fas fa-user"></i> Login</a></li>
                    <li><a href="cart.html" class="cart-icon"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
                </ul>
                <div class="burger">
                    <div class="line1"></div>
                    <div class="line2"></div>
                    <div class="line3"></div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="store-intro">
            <div class="container">
                <h1>Our Store</h1>
                <p>Browse our authentic handmade products available for purchase.</p>
            </div>
        </section>

        <section class="store-container container">
            <div class="store-filters">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search products..." />
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <div class="sort-options">
                    <select id="sortSelect">
                        <option value="">Sort by</option>
                        <option value="price-low-high">Price: Low to High</option>
                        <option value="price-high-low">Price: High to Low</option>
                    </select>
                </div>
            </div>

            <div class="products-section">
                <div class="products-grid" id="store-products">
                    <!-- Products will be injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Handmade Haven. All rights reserved.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-pinterest"></i></a>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/store.js"></script>
</body>
</html>
